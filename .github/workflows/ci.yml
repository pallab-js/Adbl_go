name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      # frontend/dist is gitignored (build artifact) but main.go embeds it,
      # so generate it before Go vet/build touches the root package.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # GTK4/WebKitGTK 6.0 dev headers (default Wails v3 stack) so the
      # root package (which imports wails v3) compiles under go vet.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      - run: go vet ./...
      - run: go test ./internal/...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  build:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev
      # Default GTK4/WebKitGTK 6.0 stack (verified locally); no gtk3 tag.
      - run: go build -o /tmp/adbl .

  graph:
    name: Dependency graph
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # "graphify" the Go module dependency graph into a Graphviz DOT file.
      - run: |
          sudo apt-get install -y -qq graphviz
          go mod graph | grep -v '^github.com/ubl/adbl ' | awk '{print $1 " -> " $2}' | sort -u > dep-graph.txt
          dot -Tpng -o dep-graph.png dep-graph.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: |
            dep-graph.txt
            dep-graph.png
          retention-days: 7
